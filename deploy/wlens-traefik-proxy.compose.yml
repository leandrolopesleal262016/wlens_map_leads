services:
  wlens-traefik-proxy:
    image: nginx:alpine
    container_name: wlens-traefik-proxy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./wlens-traefik-proxy.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.wlens.entrypoints=websecure
      - traefik.http.routers.wlens.rule=Host(`wlens.2.24.91.207.sslip.io`)
      - traefik.http.routers.wlens.tls=true
      - traefik.http.routers.wlens.tls.certresolver=letsencrypt
      - traefik.http.services.wlens.loadbalancer.server.port=80
